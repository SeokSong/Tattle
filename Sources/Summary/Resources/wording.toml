kind.appleSystem.other = "Apple system services"

# ---------------------------------------------------------------- company rows
# {categories} is the category labels joined with ", "
company.row = "{parent} · {categories}"
company.row.plain = "{parent}"
company.row.own = "{parent} · the app's own company"
company.row.own.categories = "{parent} · the app's own company · {categories}"
company.brand = "{brand} (owned by {parent})"
seen.both = "Seen in both"
seen.captures = "Seen in captures"
seen.report = "Seen in your App Privacy Report"

# ---------------------------------------------------------------- possible (never counted)
possible.heading = "Possible (not counted)"
possible.explanation = "A lookup for this name was seen, but the server is shared, so it may be a different service."

# ---------------------------------------------------------------- how much could be traced
coverage.captures = "Captures ({period}): {percent}% of this app's traffic could be traced to a company."
coverage.captures.all = "Captures ({period}): All of this app's traffic could be traced to a company."
# behind the (i) icon, not shown by default: the largest cause of the rest
coverage.reason.hiddenByApp = "Of the remaining {percent}%, the largest share went to destinations whose names the app kept hidden."
coverage.reason.startedBeforeCapture = "Of the remaining {percent}%, the largest share came from connections that started before the capture began."
coverage.reason.noName = "Of the remaining {percent}%, the largest share came from connections that did not include a destination name."
coverage.reason.unknownDestination = "Of the remaining {percent}%, the largest share went to destinations that are not in any company list."
coverage.reason.possibleOnly = "Of the remaining {percent}%, the largest share went to destinations that could only be guessed from shared servers."
coverage.report = "App Privacy Report ({period}): {identified} of this app's {total} destinations could be traced to a company. The report doesn't show how much data was sent."
coverage.report.single.traced = "App Privacy Report ({period}): this app's only destination could be traced to a company. The report doesn't show how much data was sent."
coverage.report.single.untraced = "App Privacy Report ({period}): this app's only destination could not be traced to a company. The report doesn't show how much data was sent."

# ---------------------------------------------------------------- rating lines (the band itself is Part 4)
rating.captures.shown = "Rated on {percent}% traced traffic."
rating.captures.hidden = "Not enough data to rate: {percent}% of this app's traffic could be traced to a company. A rating needs at least {threshold}%."
rating.report.shown = "Rated on {identified} of {total} traced destinations ({percent}%)."
rating.report.shown.single = "Rated on 1 of 1 traced destination (100%)."
rating.report.hidden = "Not enough data to rate: {identified} of {total} destinations ({percent}%) could be traced to a company. A rating needs at least {threshold}%."
rating.report.hidden.single = "Not enough data to rate: 0 of 1 destination (0%) could be traced to a company. A rating needs at least {threshold}%."

# ---------------------------------------------------------------- special entries
special.system = "iOS background services. Apple servers count as its own company."
special.apple = "Apple's own apps, together."
special.apple.breakdown = "Each Apple app on its own"
noprocess.one = "iOS gave no app information for 1 connection."
noprocess.other = "iOS gave no app information for {count} connections."

# ---------------------------------------------------------------- data amounts (captures only, toggle on)
data.amount = "In the capture from {day}, the largest share of the data went to {company}."

# ---------------------------------------------------------------- glossary (six terms) and how to read this
glossary.1.term = "Company"
glossary.1.text = "The business behind a destination. Brands are listed under the company that owns them, so YouTube counts as Alphabet."
glossary.2.term = "Advertising or tracking"
glossary.2.text = "A company with an advertising or analytics service among the destinations. It shows the app contacted them, not what was sent."
glossary.3.term = "The app's own company"
glossary.3.text = "The company that makes the app. It is counted and marked, because an app contacting its own servers is expected."
glossary.4.term = "Apple system and Apple apps"
glossary.4.text = "iOS background services and Apple's own apps. Apple servers count as their own company."
glossary.5.term = "Not traced"
glossary.5.text = "A destination that could not be traced to any company. It stays in the count, so the numbers never look more complete than they are."
glossary.6.term = "Possible"
glossary.6.text = "A name seen only through a lookup or a shared server. It may be a different service, so it is never counted."
howto.1 = "Companies are counted once, however many brands they have: YouTube and Google Ads are one company, Alphabet."
howto.2 = "\"Contacted\" means the app connected to the company. It does not say what was sent or why."
howto.3 = "Unknown parts are always shown next to the counts."
